  [project]
  name = "campaignhub"
  version = "0.1.0"
  description = "Nigeria-first marketing automation backend"
  requires-python = ">=3.13,<3.14"
  dependencies = [
      "alembic>=1.20.0",
      "asyncpg>=0.31.0",
      "fastapi>=0.115,<1",
      "pydantic-settings>=2.15.0",
      "sqlalchemy[asyncio]>=2.1.1",
      "uvicorn[standard]>=0.30,<1",
]

  [dependency-groups]
  dev = [
      "httpx>=0.27,<1",
      "mypy>=1.13,<2",
      "pytest>=8,<10",
      "pytest-asyncio>=0.24,<2",
      "ruff>=0.8,<1",
  ]

  [tool.uv]
  package = false

  [tool.pytest.ini_options]
  addopts = [
      "--strict-config",
      "--strict-markers",
  ]
  asyncio_mode = "auto"
  testpaths = ["tests"]
  pythonpath = ["."]

  [tool.ruff]
  line-length = 100
  target-version = "py313"

  [tool.ruff.lint]
  select = [
      "ASYNC",
      "B",
      "E",
      "F",
      "I",
      "SIM",
      "UP",
  ]

  [tool.ruff.format]
  quote-style = "double"
  indent-style = "space"
  line-ending = "auto"

  [tool.mypy]
  plugins = ["pydantic.mypy"]
  python_version = "3.13"
  strict = true
  warn_unreachable = true
  show_error_codes = true
